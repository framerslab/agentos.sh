name: Analytics choices

# Builds the static export with made-up Google Analytics and Clarity ids, serves out/ and checks in
# Chromium that nothing reaches Google or Microsoft before a visitor's yes (e2e/consent.spec.mjs).

on:
  pull_request:
    branches: [master]
    paths:
      - 'public/consent/**'
      - 'e2e/**'
      - 'app/**/layout.tsx'
      - 'app/**/legal/**'
      - 'package.json'
      - 'next.config.mjs'
      - '.github/workflows/consent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  consent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build the static export with made-up vendor ids
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-TEST000000
          NEXT_PUBLIC_CLARITY_PROJECT_ID: testclarity1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run build
      - name: No vendor script in the served HTML
        run: |
          if grep -rlE 'googletagmanager\.com/gtag|clarity\.ms/tag' out --include='*.html'; then
            echo "::error::A page loads Google Analytics or Clarity from its HTML, before any choice."
            exit 1
          fi
      # Playwright is installed outside the site's dependencies, so package-lock.json (which the tag
      # release installs with npm ci) stays as it is.
      - name: Check the choices in a browser
        env:
          CONSENT_BASE: http://127.0.0.1:4173
          CONSENT_PAGES: /en/,/en/legal/cookies/
          CONSENT_PICTURES: ${{ github.workspace }}/e2e/pictures/run
        run: |
          pw="$RUNNER_TEMP/pw"
          mkdir -p "$pw/e2e"
          npm install --no-save --no-audit --no-fund --prefix "$pw" @playwright/test@1.49.1
          "$pw/node_modules/.bin/playwright" install --with-deps chromium
          cp e2e/consent.spec.mjs e2e/playwright.config.mjs "$pw/e2e/"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > "$RUNNER_TEMP/http.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/en/ > /dev/null && break; sleep 1; done
          "$pw/node_modules/.bin/playwright" test --config "$pw/e2e/playwright.config.mjs" --output "$pw/test-results"

      - name: Keep the pictures and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consent-${{ github.run_id }}
          path: |
            e2e/pictures/run
            ${{ runner.temp }}/pw/e2e/playwright-report
            ${{ runner.temp }}/pw/test-results
          if-no-files-found: ignore
